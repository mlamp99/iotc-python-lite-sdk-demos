# ----------------------------------------------------------------------------
# DEMOS — each demo is described once, then referenced against board IDs.
# This is what eliminates duplication when one demo runs on many boards.
# ----------------------------------------------------------------------------
demos:
  - id: starter-demo
    display_name: "/IOTCONNECT Starter Demo"
    tagline: >-
      Basic telemetry and cloud-to-device command app — the starting point
      for every supported board.
    path: common/starter-demo
    runs_on: all          # special value: every board in this manifest
    tags: [basic, telemetry, c2d]

  - id: eiq-dms
    display_name: "EIQ Vision AI Driver Monitoring System (DMS)"
    tagline: >-
      Uses NXP eIQ Vision AI to analyze a live camera feed for driver safety
      indicators — eye state, head pose, drowsiness — and streams the results
      to /IOTCONNECT.
    runs_on:
      - nxp-frdm-imx-93
      - tria-maaxboard-osm93
    tags: [edge-ai, vision-ai, dms]

  - id: dms-plus-face-recog
    display_name: "DMS + Face Recognition"
    tagline: >-
      Adds face-recognition to the EIQ DMS pipeline for driver identification.
    runs_on:
      - nxp-frdm-imx-93
    tags: [edge-ai, vision-ai, dms, face-recognition]

  - id: xlinuxai-object-detection
    display_name: "X-LINUX-AI Object Detection"
    tagline: >-
      On-device 80-class object detection using ST's X-LINUX-AI software stack,
      with confidence scores streamed to /IOTCONNECT roughly once per second.
    runs_on:
      - stm32mp135f-dk
      - stm32mp157f-dk2
    tags: [edge-ai, vision-ai, st-software]

  - id: mkboxpro-ble
    display_name: "MKBOXPRO BLE Sensor Pack"
    tagline: >-
      Streams motion, environmental, and audio telemetry from a SensorTile.box
      PRO over BLE to /IOTCONNECT.
    runs_on:
      - stm32mp135f-dk
      - stm32mp157f-dk2
      - stm32mp257f-dk
    tags: [ble, sensors, st-software]

  - id: proteus-sensor-pack
    display_name: "PROTEUS Sensor Pack"
    tagline: >-
      Streams temperature, humidity, pressure, and other environmental telemetry
      from a PROTEUS sensor pack to /IOTCONNECT.
    runs_on:
      - stm32mp135f-dk
      - stm32mp157f-dk2
      - stm32mp257f-dk
    tags: [sensors, environmental]

  - id: file-upload
    display_name: "File Upload Demo"
    tagline: >-
      Captures pictures and video clips from a USB camera and uploads them to
      the /IOTCONNECT file-support S3 bucket via cloud command.
    runs_on:
      - nxp-frdm-imx-93
    tags: [s3, file-upload, ota]

  - id: fpga-ml-template-classifier
    display_name: "FPGA ML: Template Correlation Classifier"
    tagline: >-
      Deterministic 256-sample waveform classifier using dot-product templates
      on the PolarFire SoC FPGA — establishes the performance baseline before
      neural-network models.
    runs_on:
      - microchip-polarfire-soc-dk
      - microchip-polarfire-soc-vk
    tags: [edge-ai, fpga, ml-acceleration]

  - id: fpga-ml-simple-nn
    display_name: "FPGA ML: Simple Neural Network Accelerator"
    tagline: >-
      Compact fixed-point NN (256 → 12 → 6) running in PolarFire SoC FPGA fabric
      with hardware vs. software performance comparison.
    runs_on:
      - microchip-polarfire-soc-dk
      - microchip-polarfire-soc-vk
    tags: [edge-ai, fpga, ml-acceleration]

  - id: fpga-ml-complex-nn
    display_name: "FPGA ML: Complex Neural Network Accelerator"
    tagline: >-
      Two-hidden-layer NN (~11K weights) with batch-aware DMA on PolarFire SoC,
      showing the strongest FPGA acceleration advantage in the series.
    runs_on:
      - microchip-polarfire-soc-dk
      - microchip-polarfire-soc-vk
    tags: [edge-ai, fpga, ml-acceleration]

  - id: drp-ai-inference
    display_name: "Renesas DRP-AI Inference"
    tagline: >-
      Runs OpenCV face/body detection plus 14 pre-built Renesas AI SDK demos on
      the RZ/V2H's DRP-AI accelerator, with cloud-controlled demo switching.
    runs_on:
      - renesas-rzv2h-evk
    tags: [edge-ai, drp-ai, vision-ai]

  - id: tria-vision-ai
    display_name: "Tria Vision AI"
    tagline: >-
      Pose detection, object detection, and image classification on the Vision
      AI-KIT 6490, with dual-camera support for two simultaneous models.
    runs_on:
      - tria-vision-ai-kit-6490
    tags: [edge-ai, vision-ai, qualcomm]

  - id: kws-demo
    display_name: "Keyword Spotting Demo"
    tagline: >-
      TensorFlow Lite DS-CNN speech-command classifier on a USB mic, with OTA
      model swapping from the Arm ML Zoo.
    runs_on:
      - microchip-sama7d65-curiosity
    tags: [edge-ai, audio-ai, ota]

  - id: kws-game
    display_name: "Voice Blackjack (KWS Game)"
    tagline: >-
      Browser-hosted blackjack game controlled by voice commands using the same
      KWS pipeline; game state and inference results stream to /IOTCONNECT.
    runs_on:
      - microchip-sama7d65-curiosity
    tags: [edge-ai, audio-ai, demo-app]

  - id: pac1934-power
    display_name: "PAC1934 Power Monitoring"
    tagline: >-
      Reads voltage, current, and power from the on-board PAC1934 four-channel
      DC power monitor over I2C and publishes to /IOTCONNECT.
    runs_on:
      - microchip-sama7d65-curiosity
    tags: [power-monitoring, sensors]

  - id: kvs-putmedia
    display_name: "AWS KVS PutMedia"
    tagline: >-
      Streams stored video to AWS Kinesis Video Streams for later playback in
      the /IOTCONNECT dashboard (5–15s latency; suited to security/recording).
    cloud: aws
    runs_on:
      - nvidia-jetson-orin
      - nxp-frdm-imx-93
      - stm32mp135f-dk
      - stm32mp157f-dk2
      - stm32mp257f-dk
      - stm32mp257f-ev1
      - tria-vision-ai-kit-6490
    tags: [aws, kvs, video-streaming]

  - id: kvs-webrtc
    display_name: "AWS KVS WebRTC"
    tagline: >-
      Peer-to-peer video from device to browser via KVS signaling for sub-second
      latency real-time monitoring (no stored playback).
    cloud: aws
    runs_on:
      - nxp-frdm-imx-93
      - stm32mp135f-dk
      - stm32mp157f-dk2
      - stm32mp257f-dk
      - stm32mp257f-ev1
      - tria-vision-ai-kit-6490
    tags: [aws, kvs, video-streaming, webrtc]

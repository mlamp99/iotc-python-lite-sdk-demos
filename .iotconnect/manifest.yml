# /IOTCONNECT Enablement Manifest
# Schema: https://github.com/avnet-iotconnect/<spec-repo>/blob/main/manifest.schema.json
# This file is read by the /IOTCONNECT Enablement Directory page builder.
# Edit this file when adding/removing boards or demos. Keep taglines short (1-2 sentences max);
# long-form content lives in READMEs.

schema_version: "1.0"

# ----------------------------------------------------------------------------
# REPO-LEVEL METADATA
# ----------------------------------------------------------------------------
repo:
  name: iotc-python-lite-sdk-demos
  display_name: "/IOTCONNECT Python Lite SDK Demos"
  kind: demo-collection
  tagline: >-
    Pre-built guides and demos that use the /IOTCONNECT Python Lite SDK to
    connect a variety of Linux-class development boards to /IOTCONNECT.
  status: active            # active | beta | paused | deprecated | archived
  license: MIT
  primary_language: python

  # SDKs/libraries this repo depends on. List in dependency order
  # (closest to the application first, foundational library last).
  sdks:
    - repo: avnet-iotconnect/iotc-python-lite-sdk
      name: "/IOTCONNECT Python Lite SDK"
    - repo: avnet-iotconnect/iotc-python-lib
      name: "/IOTCONNECT Protocol Python Library"

  # Every supplier whose silicon/board appears anywhere in this repo.
  # Used by the directory page to surface this repo under each supplier's filter.
  # NOTE: this is what fixes the "multi-supplier repo" problem on the current page.
  suppliers:
    - arduino
    - microchip
    - nvidia
    - nxp
    - raspberry-pi
    - renesas
    - st
    - tria

  clouds:
    - aws
    - azure

  # Free-form tags for faceted filtering on the directory page.
  tags:
    - python
    - linux
    - mpu
    - edge-ai
    - vision-ai
    - kvs
    - ble
    - ota

  # Cross-references to related repos (shown as "see also" on the repo card).
  related_repos:
    - avnet-iotconnect/iotc-python-lite-sdk
    - avnet-iotconnect/iotc-python-greengrass-demos

